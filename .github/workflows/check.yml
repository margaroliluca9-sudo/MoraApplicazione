# CONTROLLO PRIMA DI PUBBLICARE: a ogni modifica GitHub costruisce l'app e la prova da solo
# (pagine principali, Area admin, Ufficio, schermo TV, gioco) con un database FINTO, senza toccare i dati veri.
# Se qualcosa non va, il controllo diventa rosso e Vercel NON pubblica quella versione
# (vedi scripts/vercel-wait-check.js): i tecnici restano sulla versione di prima, che funziona.
name: Controllo app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controllo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controllo:
    name: Controllo app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Installa
        run: npm install --no-audit --no-fund
      - name: Costruisci l'app (come Vercel)
        env:
          CI: "false"
        run: |
          npm run build > build.log 2>&1 || { echo "::error::$(tail -80 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          tail -5 build.log
      - name: Strumenti di prova
        run: |
          mkdir -p .ci
          npm install --no-save --no-audit --no-fund --prefix .ci react@19.2.8 react-dom@19.2.8 scheduler@0.27.0 typescript@6.0.3 playwright@1.56.0
          # se i server di Ubuntu non rispondono (succede), il browser si installa lo stesso senza i pacchetti di sistema:
          # sulla macchina di GitHub ci sono già quasi tutti
          npx --prefix .ci playwright install --with-deps chromium || { echo "Pacchetti di sistema non scaricati: installo solo il browser"; npx --prefix .ci playwright install chromium; }
      - name: Prova l'app
        run: |
          node tests/build-harness.js "$PWD/.ci/node_modules" src "$PWD/.ci/pagina"
          node tests/smoke.js "$PWD/.ci/node_modules" "$PWD/.ci/pagina" > prova.log 2>&1 || { echo "::error::$(grep -v '^OK' prova.log | tail -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          cat prova.log
